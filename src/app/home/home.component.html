<div class="home-wrapper position-relative text-white">
  <div class="background-img"></div>
  <section class="home-content container py-5">
    <div class="about-box mx-auto text-center mb-5">
      <h1 class="display-3 fw-bold text-uppercase name">Maggie Collette</h1>
      <p class="lead mt-3 about-text">
        {{ info }}
        <a [attr.href]="url" target="_blank">
          {{ rp }}
          <i class="bi bi-box-arrow-up-right"></i>
        </a>
      </p>
    </div>
    <div class="row g-4 justify-content-center text-center link-grid">
      <div class="col-sm-6 col-lg-3">
        <a routerLink="/resume" class="nav-box d-block p-4 border border-2">
          <h2 class="h5 text-uppercase">Resume</h2>
        </a>
      </div>
      <div class="col-sm-6 col-lg-3">
        <a routerLink="/projects" class="nav-box d-block p-4 border border-2">
          <h2 class="h5 text-uppercase">Projects</h2>
        </a>
      </div>
      <div class="col-sm-6 col-lg-3">
        <a
          routerLink="/photography"
          class="nav-box d-block p-4 border border-2"
        >
          <h2 class="h5 text-uppercase">Photography</h2>
        </a>
      </div>
    </div>
  </section>
</div>
